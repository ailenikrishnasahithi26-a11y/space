
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galactic Odyssey</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div id="stars"></div>

<header>

    <div class="logo">
        🚀 GALACTIC ODYSSEY
    </div>

    <div class="header-actions">
        <button>🔊</button>
        <button>⛶</button>
        <button>⚙</button>
    </div>

</header>

<!-- LEFT PANEL -->

<div class="left-panel">

    <div class="profile-card">

        <div class="avatar">
            👨‍🚀
        </div>

        <h3 id="rank">
            Commander
        </h3>

        <p>
            Explorer
        </p>

    </div>

    <div class="stat-card">

        <h4>Fuel</h4>

        <div class="progress">
            <div id="fuel-bar"></div>
        </div>

        <p id="fuel">
            100 / 100
        </p>

    </div>

    <div class="stat-card">

        <h4>XP</h4>

        <div class="progress">
            <div id="xp-bar"></div>
        </div>

        <p id="xp">
            0
        </p>

    </div>

    <div class="stat-card">

        <h4>Credits</h4>

        <p id="credits">
            500
        </p>

    </div>

    <button id="refuel-btn">
        ⛽ Refuel
    </button>

</div>

<!-- SOLAR SYSTEM -->

<div id="solar-system"></div>

<!-- RIGHT PANEL -->

<div class="planet-panel">

    <h2>PLANET INFORMATION</h2>

    <div class="planet-preview"></div>

    <h3 id="planet-name">
        Select Planet
    </h3>

    <p id="planet-description">
        Click any planet in the solar system.
    </p>

    <div class="planet-stats">

        <div>
            Fuel Cost:
            <span id="fuel-cost">
                -
            </span>
        </div>

        <div>
            XP Reward:
            <span id="xp-reward">
                -
            </span>
        </div>

        <div>
            Threat:
            <span id="threat-level">
                -
            </span>
        </div>

    </div>

    <button id="travel-btn">
        🚀 Travel
    </button>

</div>

<!-- MISSION PANEL -->

<div class="mission-panel">

    <h2>CURRENT MISSIONS</h2>

    <div id="mission-list">

    </div>

</div>

<!-- CONTROLS -->

<div class="controls">

    <h4>Controls</h4>

    <p>Drag : Rotate</p>

    <p>Scroll : Zoom</p>

    <p>Right Click : Pan</p>

</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/app.js"></script>

</body>
</html>
